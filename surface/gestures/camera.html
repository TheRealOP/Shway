<!doctype html>
<!-- Shway gesture camera harness (DEV-91). Serve this directory over http(s) on localhost:
     python3 -m http.server -d surface/gestures 8770 → http://127.0.0.1:8770/camera.html
     Loads MediaPipe Tasks Vision (Apache-2.0) and its hand model from public CDNs at runtime; nothing is vendored.
     Space = engage (fallback for 🤘) · Shift = fine mode · Esc = cancel · R = record trace -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shway Gestures</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --accent: #0a7; --warn: #c50; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #3c9; --warn: #f80; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .stage { position: relative; width: min(640px, 100%); }
  video { display: block; width: 100%; transform: scaleX(-1); background: #000; border-radius: 6px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #state { font-size: 28px; font-weight: 600; }
  #state[data-s="Adjusting"], #state[data-s="Armed"] { color: var(--accent); }
  #state[data-s="TrackingLost"], #state[data-s="Cancelled"] { color: var(--warn); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0; }
  dt { color: var(--muted); }
  #log { font: 12px ui-monospace, monospace; max-height: 240px; overflow: auto; white-space: pre; }
  #err { color: var(--warn); }
  /* ?editor: the real editor fills the page, camera + readouts float in a corner */
  body.editor { padding: 0; height: 100vh; overflow: hidden; }
  body.editor #ed { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  body.editor > .row { position: fixed; right: 12px; bottom: 12px; z-index: 1; gap: 8px; flex-direction: column;
    width: min(360px, calc(100% - 24px)); background: color-mix(in srgb, var(--bg) 88%, transparent); padding: 8px; border-radius: 8px; }
  body.editor #log { display: none; }
  body.editor .stage { width: 100%; }
  body.editor #state { font-size: 18px; }
  body.editor dl { font-size: 11px; margin: 4px 0; }
  @media (max-width: 900px) { body.editor > .row { width: 240px; } body.editor dl { display: none; } }
</style>
</head>
<body>
<div class="row">
  <div class="stage"><video id="v" autoplay muted playsinline></video><canvas id="o"></canvas></div>
  <div>
    <div>Target: <b>playhead</b> · <span id="mode">shuttle</span></div>
    <div id="state" data-s="Idle">Idle</div>
    <dl>
      <dt>twist</dt><dd id="angle">–</dd>
      <dt>rate</dt><dd id="rate">0</dd>
      <dt>hand</dt><dd id="hand">–</dd>
      <dt>🤘 fingers</dt><dd id="pinch">–</dd>
      <dt>thumb–index tap</dt><dd id="middle">–</dd>
      <dt>chop travel</dt><dd id="chop">–</dd>
      <dt>feedback p95</dt><dd id="lat">–</dd>
      <dt>recording</dt><dd id="rec">off (R)</dd>
    </dl>
    <div id="err"></div>
  </div>
</div>
<div id="log"></div>
<script type="module">
import { createRecognizer, DEFAULTS as C } from "./recognizer.mjs";
import { openCamera, runHands, drawOverlay, flashFor } from "./hands.mjs";
const $ = (id) => document.getElementById(id);
const keys = { key: false, fine: false, cancel: false };
const rec = { on: false, frames: [] };
const lat = [];
let recognizer = createRecognizer(); // recreated with the camera's aspect once it starts
// Events cross the integration boundary here. Codex's adapter replaces this sink.
const sink = (e) => { $("log").textContent = `${e.t.toFixed(0)} ${JSON.stringify(e)}\n` + $("log").textContent.slice(0, 4000); };
let sinkFn = sink;
let flash = null; // {text, until}
window.shwayGestures = { get recognizer() { return recognizer; }, setSink: (f) => { sinkFn = f; }, drawOverlay: (c, h, v, now) => drawOverlay(c, h, v, now, flash) };

addEventListener("keydown", (e) => {
  if (e.code === "Space") { keys.key = true; e.preventDefault(); }
  if (e.key === "Shift") keys.fine = true;
  if (e.key === "Escape") keys.cancel = true;
  if (e.key === "r" && !e.repeat) toggleRecord();
});
addEventListener("keyup", (e) => {
  if (e.code === "Space") keys.key = false;
  if (e.key === "Shift") keys.fine = false;
});
addEventListener("blur", () => { keys.key = keys.fine = false; }); // a lost keyup must not leave control engaged

function toggleRecord() {
  rec.on = !rec.on;
  if (rec.on) { rec.frames = []; $("rec").textContent = "on"; return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ frames: rec.frames })], { type: "application/json" }));
  a.download = `trace-${Date.now()}.json`;
  a.click();
  $("rec").textContent = `saved ${rec.frames.length} frames`;
}

const p95 = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * 0.95))]; };

async function main() {
  const video = $("v");
  try {
    await openCamera(video);
  } catch (e) {
    $("err").textContent = `Camera unavailable: ${e.name}: ${e.message}. Space still engages, but twist needs a hand.`;
    return;
  }
  if (video.videoWidth && video.videoHeight) recognizer = createRecognizer({ aspect: video.videoWidth / video.videoHeight });
  await runHands(video, (t, t0, hand) => {
    const frame = { t, hand, ...keys };
    keys.cancel = false;
    if (rec.on) rec.frames.push(frame);
    for (const e of recognizer.step(frame)) {
      flash = flashFor(e, t) ?? flash;
      sinkFn(e);
    }
    const v = recognizer.view();
    const canvas = $("o");
    if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    drawOverlay(canvas, hand, v, t, flash);
    $("state").textContent = v.state; $("state").dataset.s = v.state;
    $("mode").textContent = v.fine ? "fine (frame step)" : "shuttle";
    $("angle").textContent = `${v.angleDeg.toFixed(1)}°`;
    $("rate").textContent = `${v.rate}×`;
    const fmt = (x) => (Number.isFinite(x) ? x.toFixed(2) : "–");
    $("pinch").textContent = `${v.hornsFingers}/4 (🤘 = 4) · ${v.pose ?? "–"}${v.drawing ? " · drawing" : ""}`;
    $("middle").textContent = `${fmt(v.tapRatio)} (tap < ${C.tapOn})${v.tapping ? " · closed" : ""}`;
    $("chop").textContent = `${fmt(v.chopTravel)} / ${C.chopMinPalms} palms${v.blade ? " · blade" : ""}`;
    $("hand").textContent = hand ? `${v.handedness} ${(v.confidence * 100).toFixed(0)}%${v.horns ? " · 🤘" : ""}` : "none";
    requestAnimationFrame(() => {
      lat.push(performance.now() - t0);
      if (lat.length > 300) lat.shift();
      $("lat").textContent = `${p95(lat).toFixed(0)} ms (n=${lat.length})`;
    });
  });
}
main().catch((e) => { $("err").textContent = `Startup failed: ${e.message}`; });

// ?editor: drive the real editor (same origin: serve this page from the editor's dist with adapter.js).
async function connectEditor() {
  document.body.classList.add("editor");
  const frame = document.createElement("iframe");
  frame.id = "ed";
  frame.src = "index.html";
  frame.allow = "autoplay";
  document.body.prepend(frame);
  const status = (text) => { $("err").textContent = text; };
  status("Connecting to the editor…");
  let api = null;
  for (let i = 0; i < 1200 && !api; i++) {
    const w = frame.contentWindow;
    if (w?.filmcraftLoad?.fatal) return status(`Editor stopped: ${w.filmcraftLoad.fatal}`);
    if (w?.filmcraft && w.filmcraftLoad?.readyMs) api = w.filmcraft;
    else await new Promise((r) => setTimeout(r, 100));
  }
  if (!api) return status("Editor did not start within 2 minutes.");
  const { ShwayAdapter } = await import("./adapter.js");
  const { createBridge } = await import("./bridge.mjs");
  const adapter = await ShwayAdapter.connect(api);
  const bridge = createBridge(adapter, { onError: (err, e) => status(`${e.type} failed: ${err?.message ?? err}`) });
  window.shwayGestures.adapter = adapter;
  window.shwayGestures.bridge = bridge;
  sinkFn = (e) => { sink(e); bridge(e); };
  status("");
}
if (new URLSearchParams(location.search).has("editor")) {
  connectEditor().catch((e) => { $("err").textContent = `Editor connection failed: ${e.message}`; });
}
</script>
</body>
</html>
