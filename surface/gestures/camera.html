<!doctype html>
<!-- Shway gesture camera harness (DEV-91). Serve this directory over http(s) on localhost:
     python3 -m http.server -d surface/gestures 8770 → http://127.0.0.1:8770/camera.html
     Loads MediaPipe Tasks Vision (Apache-2.0) and its hand model from public CDNs at runtime; nothing is vendored.
     Space = engage (fallback for pinch) · Shift = fine mode · Esc = cancel · R = record trace -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shway Gestures</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --accent: #0a7; --warn: #c50; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #3c9; --warn: #f80; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .stage { position: relative; width: min(640px, 100%); }
  video { display: block; width: 100%; transform: scaleX(-1); background: #000; border-radius: 6px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #state { font-size: 28px; font-weight: 600; }
  #state[data-s="Adjusting"], #state[data-s="Armed"] { color: var(--accent); }
  #state[data-s="TrackingLost"], #state[data-s="Cancelled"] { color: var(--warn); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0; }
  dt { color: var(--muted); }
  #log { font: 12px ui-monospace, monospace; max-height: 240px; overflow: auto; white-space: pre; }
  #err { color: var(--warn); }
  /* ?editor: the real editor fills the page, camera + readouts float in a corner */
  body.editor { padding: 0; height: 100vh; overflow: hidden; }
  body.editor #ed { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  body.editor > .row { position: fixed; right: 12px; bottom: 12px; z-index: 1; gap: 8px; flex-direction: column;
    width: min(360px, calc(100% - 24px)); background: color-mix(in srgb, var(--bg) 88%, transparent); padding: 8px; border-radius: 8px; }
  body.editor #log { display: none; }
  body.editor .stage { width: 100%; }
  body.editor #state { font-size: 18px; }
  body.editor dl { font-size: 11px; margin: 4px 0; }
  @media (max-width: 900px) { body.editor > .row { width: 240px; } body.editor dl { display: none; } }
</style>
</head>
<body>
<div class="row">
  <div class="stage"><video id="v" autoplay muted playsinline></video><canvas id="o"></canvas></div>
  <div>
    <div>Target: <b>playhead</b> · <span id="mode">shuttle</span></div>
    <div id="state" data-s="Idle">Idle</div>
    <dl>
      <dt>twist</dt><dd id="angle">–</dd>
      <dt>rate</dt><dd id="rate">0</dd>
      <dt>hand</dt><dd id="hand">–</dd>
      <dt>thumb–index</dt><dd id="pinch">–</dd>
      <dt>thumb–middle</dt><dd id="middle">–</dd>
      <dt>chop travel</dt><dd id="chop">–</dd>
      <dt>feedback p95</dt><dd id="lat">–</dd>
      <dt>recording</dt><dd id="rec">off (R)</dd>
    </dl>
    <div id="err"></div>
  </div>
</div>
<div id="log"></div>
<script type="module">
import { createRecognizer, DEFAULTS as C } from "./recognizer.mjs";

const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const $ = (id) => document.getElementById(id);
const keys = { key: false, fine: false, cancel: false };
const rec = { on: false, frames: [] };
const lat = [];
let recognizer = createRecognizer(); // recreated with the camera's aspect once it starts
// Events cross the integration boundary here. Codex's adapter replaces this sink.
const sink = (e) => { $("log").textContent = `${e.t.toFixed(0)} ${JSON.stringify(e)}\n` + $("log").textContent.slice(0, 4000); };
window.shwayGestures = { get recognizer() { return recognizer; }, setSink: (f) => { sinkFn = f; }, drawOverlay };
let sinkFn = sink;

addEventListener("keydown", (e) => {
  if (e.code === "Space") { keys.key = true; e.preventDefault(); }
  if (e.key === "Shift") keys.fine = true;
  if (e.key === "Escape") keys.cancel = true;
  if (e.key === "r" && !e.repeat) toggleRecord();
});
addEventListener("keyup", (e) => {
  if (e.code === "Space") keys.key = false;
  if (e.key === "Shift") keys.fine = false;
});
addEventListener("blur", () => { keys.key = keys.fine = false; }); // a lost keyup must not leave control engaged

function toggleRecord() {
  rec.on = !rec.on;
  if (rec.on) { rec.frames = []; $("rec").textContent = "on"; return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ frames: rec.frames })], { type: "application/json" }));
  a.download = `trace-${Date.now()}.json`;
  a.click();
  $("rec").textContent = `saved ${rec.frames.length} frames`;
}

// ---- Overlay: skeleton, pinch meter, twist dial, swipe flash. Drawn in unmirrored canvas space
// with x flipped so it lines up with the mirrored video and text stays readable.
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const COLORS = { Idle: "#bbb", Armed: "#2c9", Adjusting: "#3cf", TrackingLost: "#f80", Cancelled: "#f80" };
const LABELS = { Idle: "pinch or hold Space", Armed: "armed — twist to scrub", Adjusting: "scrubbing",
  TrackingLost: "tracking lost — let go to re-engage", Cancelled: "cancelled — let go to re-engage" };
let flash = null; // {text, until}

function drawOverlay(canvas, hand, v, now) {
  const w = canvas.width, h = canvas.height, g = canvas.getContext("2d");
  g.clearRect(0, 0, w, h);
  const color = COLORS[v.state] ?? "#bbb";
  g.font = "600 16px system-ui, sans-serif";
  g.lineCap = "round";
  if (flash && now < flash.until) {
    g.fillStyle = "rgba(60,200,255,0.85)";
    g.font = "700 64px system-ui, sans-serif";
    g.textAlign = "center";
    g.fillText(flash.text, w / 2, 80);
    g.font = "600 16px system-ui, sans-serif";
  }
  if (!hand) {
    if (v.state === "TrackingLost" || v.state === "Cancelled") {
      g.fillStyle = color; g.textAlign = "center"; g.fillText(LABELS[v.state], w / 2, h - 20);
    }
    return;
  }
  const P = hand.image.map((p) => ({ x: (1 - p.x) * w, y: p.y * h }));
  // Skeleton
  g.strokeStyle = color; g.lineWidth = 3;
  for (const [a, b] of BONES) { g.beginPath(); g.moveTo(P[a].x, P[a].y); g.lineTo(P[b].x, P[b].y); g.stroke(); }
  g.fillStyle = "#fff";
  for (const p of P) { g.beginPath(); g.arc(p.x, p.y, 3, 0, 7); g.fill(); }
  // Palm centre and size in pixels
  const cx = (P[0].x + P[5].x + P[9].x + P[17].x) / 4, cy = (P[0].y + P[5].y + P[9].y + P[17].y) / 4;
  const R = Math.max(50, Math.hypot(P[9].x - P[0].x, P[9].y - P[0].y) * 1.2);
  const engaged = v.state === "Armed" || v.state === "Adjusting";

  if (!engaged && v.blade) {
    // Chop-ready: a blade line along the hand, pointing down.
    g.strokeStyle = "#f5c"; g.lineWidth = 4; g.setLineDash([10, 6]);
    g.beginPath(); g.moveTo(cx, cy - R); g.lineTo(cx, cy + R * 1.6); g.stroke(); g.setLineDash([]);
    g.fillStyle = "#f5c"; g.textAlign = "center"; g.fillText("chop down to cut", cx, cy + R * 1.6 + 20);
  }
  if (!engaged && v.tapping) {
    g.fillStyle = "#fc3"; g.beginPath(); g.arc(P[4].x, P[4].y, 10, 0, 7); g.fill();
  }
  if (!engaged) {
    // Pinch meter: thumb–index line + ring that fills as the pinch closes.
    const fill = Number.isFinite(v.pinchRatio) ? Math.max(0, Math.min(1, (1.2 - v.pinchRatio) / (1.2 - C.pinchOn))) : 0;
    g.strokeStyle = fill >= 1 ? "#2c9" : "rgba(255,255,255,0.7)"; g.lineWidth = 2; g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(P[4].x, P[4].y); g.lineTo(P[8].x, P[8].y); g.stroke(); g.setLineDash([]);
    g.strokeStyle = "rgba(255,255,255,0.25)"; g.lineWidth = 8;
    g.beginPath(); g.arc(cx, cy, R * 0.6, 0, 7); g.stroke();
    g.strokeStyle = v.pinching ? "#2c9" : "rgba(255,255,255,0.85)";
    g.beginPath(); g.arc(cx, cy, R * 0.6, -Math.PI / 2, -Math.PI / 2 + fill * 2 * Math.PI); g.stroke();
  } else {
    // Twist dial: 0° at top; dead zone grey; speed bands brighter outward; needle = current twist.
    const rad = (deg) => -Math.PI / 2 + (deg * Math.PI) / 180;
    const arc = (a0, a1, style, width) => { g.strokeStyle = style; g.lineWidth = width; g.beginPath(); g.arc(cx, cy, R, rad(a0), rad(a1)); g.stroke(); };
    arc(-C.deadZoneDeg, C.deadZoneDeg, "rgba(255,255,255,0.35)", 10);
    const n = C.rates.length, span = (C.maxDeg - C.deadZoneDeg) / n;
    g.textAlign = "center"; g.font = "600 12px system-ui, sans-serif";
    for (let k = 0; k < n; k++) {
      const a0 = C.deadZoneDeg + k * span, a1 = k === n - 1 ? C.maxDeg + 30 : a0 + span;
      const style = `rgba(60,200,255,${0.25 + 0.6 * (k / Math.max(1, n - 1))})`;
      for (const s of [1, -1]) {
        arc(s > 0 ? a0 : -a1, s > 0 ? a1 : -a0, style, 10);
        if (!v.fine) {
          const m = rad(s * (a0 + Math.min(span, a1 - a0) / 2));
          g.fillStyle = "#fff";
          g.fillText(`${s > 0 ? "" : "−"}${C.rates[k]}×`, cx + Math.cos(m) * (R + 26), cy + Math.sin(m) * (R + 26) + 4);
        }
      }
    }
    if (v.fine) { // detent ticks
      g.strokeStyle = "#fff"; g.lineWidth = 2;
      for (let d = C.deadZoneDeg; d <= C.maxDeg + 30; d += C.fineDetentDeg) for (const s of [1, -1]) {
        const m = rad(s * d);
        g.beginPath(); g.moveTo(cx + Math.cos(m) * (R - 9), cy + Math.sin(m) * (R - 9)); g.lineTo(cx + Math.cos(m) * (R + 9), cy + Math.sin(m) * (R + 9)); g.stroke();
      }
    }
    const a = rad(Math.max(-130, Math.min(130, v.angleDeg)));
    g.strokeStyle = color; g.lineWidth = 4;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * (R + 12), cy + Math.sin(a) * (R + 12)); g.stroke();
    g.fillStyle = color; g.beginPath(); g.arc(cx, cy, 6, 0, 7); g.fill();
    g.font = "700 20px system-ui, sans-serif"; g.fillStyle = "#fff";
    g.fillText(v.fine ? "fine" : `${v.rate}×`, cx, cy + R + 36);
  }
  // State label above the hand
  const top = Math.min(...P.map((p) => p.y));
  g.textAlign = "center"; g.font = "600 16px system-ui, sans-serif";
  const label = LABELS[v.state] ?? v.state;
  const tw = g.measureText(label).width + 16;
  g.fillStyle = "rgba(0,0,0,0.6)"; g.fillRect(cx - tw / 2, top - 40, tw, 26);
  g.fillStyle = color; g.fillText(label, cx, top - 21);
}

const p95 = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * 0.95))]; };

async function main() {
  const video = $("v");
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  } catch (e) {
    $("err").textContent = `Camera unavailable: ${e.name}: ${e.message}. Space still engages, but twist needs a hand.`;
    return;
  }
  await new Promise((ok) => (video.readyState >= 1 ? ok() : video.addEventListener("loadedmetadata", ok, { once: true })));
  if (video.videoWidth && video.videoHeight) recognizer = createRecognizer({ aspect: video.videoWidth / video.videoHeight });
  const { FilesetResolver, HandLandmarker } = await import(`${VISION}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${VISION}/wasm`);
  const landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL, delegate: "GPU" }, runningMode: "VIDEO", numHands: 1,
  });
  let last = -1;
  const onFrame = (now, meta) => {
    const t0 = meta?.captureTime ?? now;
    const t = performance.now();
    if (t > last) {
      last = t;
      const r = landmarker.detectForVideo(video, t);
      const hand = r.landmarks?.[0] && r.worldLandmarks?.[0] ? {
        image: r.landmarks[0], world: r.worldLandmarks[0],
        handedness: r.handedness?.[0]?.[0]?.categoryName ?? "", score: r.handedness?.[0]?.[0]?.score ?? 0,
      } : null;
      const frame = { t, hand, ...keys };
      keys.cancel = false;
      if (rec.on) rec.frames.push(frame);
      for (const e of recognizer.step(frame)) {
        const text = { swipe: e.direction === "right" ? "→" : "←", "double-tap": "double tap", chop: "✂ cut" }[e.type];
        if (text) flash = { text, until: t + 600 };
        sinkFn(e);
      }
      const v = recognizer.view();
      const canvas = $("o");
      if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
      drawOverlay(canvas, hand, v, t);
      $("state").textContent = v.state; $("state").dataset.s = v.state;
      $("mode").textContent = v.fine ? "fine (frame step)" : "shuttle";
      $("angle").textContent = `${v.angleDeg.toFixed(1)}°`;
      $("rate").textContent = `${v.rate}×`;
      const fmt = (x) => (Number.isFinite(x) ? x.toFixed(2) : "–");
      $("pinch").textContent = `${fmt(v.pinchRatio)} (pinch < ${C.pinchOn})`;
      $("middle").textContent = `${fmt(v.middleRatio)} (tap < ${C.tapOn})${v.tapping ? " · closed" : ""}`;
      $("chop").textContent = `${fmt(v.chopTravel)} / ${C.chopMinPalms} palms${v.blade ? " · blade" : ""}`;
      $("hand").textContent = hand ? `${v.handedness} ${(v.confidence * 100).toFixed(0)}%${v.pinching ? " · pinch" : ""}` : "none";
      requestAnimationFrame(() => {
        lat.push(performance.now() - t0);
        if (lat.length > 300) lat.shift();
        $("lat").textContent = `${p95(lat).toFixed(0)} ms (n=${lat.length})`;
      });
    }
    video.requestVideoFrameCallback(onFrame);
  };
  video.requestVideoFrameCallback(onFrame);
}
main().catch((e) => { $("err").textContent = `Startup failed: ${e.message}`; });

// ?editor: drive the real editor (same origin: serve this page from the editor's dist with adapter.js).
async function connectEditor() {
  document.body.classList.add("editor");
  const frame = document.createElement("iframe");
  frame.id = "ed";
  frame.src = "index.html";
  frame.allow = "autoplay";
  document.body.prepend(frame);
  const status = (text) => { $("err").textContent = text; };
  status("Connecting to the editor…");
  let api = null;
  for (let i = 0; i < 1200 && !api; i++) {
    const w = frame.contentWindow;
    if (w?.filmcraftLoad?.fatal) return status(`Editor stopped: ${w.filmcraftLoad.fatal}`);
    if (w?.filmcraft && w.filmcraftLoad?.readyMs) api = w.filmcraft;
    else await new Promise((r) => setTimeout(r, 100));
  }
  if (!api) return status("Editor did not start within 2 minutes.");
  const { ShwayAdapter } = await import("./adapter.js");
  const { createBridge } = await import("./bridge.mjs");
  const adapter = await ShwayAdapter.connect(api);
  const bridge = createBridge(adapter, { onError: (err, e) => status(`${e.type} failed: ${err?.message ?? err}`) });
  window.shwayGestures.adapter = adapter;
  window.shwayGestures.bridge = bridge;
  sinkFn = (e) => { sink(e); bridge(e); };
  status("");
}
if (new URLSearchParams(location.search).has("editor")) {
  connectEditor().catch((e) => { $("err").textContent = `Editor connection failed: ${e.message}`; });
}
</script>
</body>
</html>
